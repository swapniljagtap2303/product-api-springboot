spring.application.name=zest-india-product-api

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/zest_product_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080


app.jwt.secret=test-secret-key-that-is-long-enough-123456789
app.jwt.expiration-ms=900000